<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated molecular orbital">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#1a1230"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </radialGradient>
  </defs>

  <rect width="960" height="280" fill="url(#bg2)"/>
  <g transform="translate(480 140)">
    <circle r="22" fill="url(#core)">
      <animate attributeName="r" values="20;24;20" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <ellipse rx="170" ry="60" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="120" ry="40" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.8" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="120" ry="40" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8" transform="rotate(-60)">
      <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <circle cx="170" cy="0" r="7" fill="#93c5fd">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="0" r="6" fill="#c4b5fd">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="0" r="6" fill="#6ee7b7">
      <animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="38" y="254" fill="#cbd5e1" font-family="monospace" font-size="18">Computational Chemistry Orbital Dynamics</text>
</svg>