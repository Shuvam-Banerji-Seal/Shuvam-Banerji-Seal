<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Entrepreneurial ventures: Synapse and UnderWater AI, funded by MeitY, incubated at RISE">
  <defs>
    <filter id="st-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .st-title { fill:#c9d1d9; font-family:'Courier New',monospace; font-size:13.5px; font-weight:bold; }
      .st-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9.5px; }
      .st-lab   { fill:#c9d1d9; font-family:'Courier New',monospace; font-size:11px; font-weight:bold; text-anchor:middle; }
      .st-sublab{ fill:#8b949e; font-family:'Courier New',monospace; font-size:8.5px; text-anchor:middle; }
      .st-box   { fill:#161b22; stroke-width:1.6; }
      .st-badge { font-family:'Courier New',monospace; font-size:8.5px; font-weight:bold; text-anchor:middle; fill:#fff; }
    </style>
  </defs>

  <rect width="800" height="230" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="798.5" height="228.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="400" y="24" text-anchor="middle" class="st-title">ENTREPRENEURIAL VENTURES — MEITY GENESIS EiR</text>
  <text x="400" y="39" text-anchor="middle" class="st-sub">two deeptech startups · grant-funded · DPIIT recognition in progress</text>

  <!-- ══ ventures ══ -->
  <rect x="18" y="56" width="200" height="72" rx="8" class="st-box" stroke="#58a6ff"/>
  <circle cx="34" cy="72" r="4" fill="#58a6ff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="118" y="78" class="st-lab" fill="#79c0ff">SYNAPSE</text>
  <text x="118" y="93" class="st-sublab">AI-fintech · democratizing ML</text>
  <text x="118" y="105" class="st-sublab">smart trading signals</text>
  <text x="118" y="117" class="st-sublab">ML · stocks · crypto</text>

  <rect x="18" y="140" width="200" height="72" rx="8" class="st-box" stroke="#56d364"/>
  <circle cx="34" cy="156" r="4" fill="#56d364"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <text x="118" y="162" class="st-lab" fill="#56d364">UNDERWATER AI</text>
  <text x="118" y="177" class="st-sublab">deeptech marine vision</text>
  <text x="118" y="189" class="st-sublab">species ID · DNN</text>
  <text x="118" y="201" class="st-sublab">conservation at scale</text>

  <!-- ══ support ══ -->
  <rect x="250" y="56" width="150" height="72" rx="8" class="st-box" stroke="#d2a8ff"/>
  <text x="325" y="78" class="st-lab" fill="#d2a8ff">MeitY</text>
  <text x="325" y="93" class="st-sublab">startup hub · GENESIS</text>
  <text x="325" y="105" class="st-sublab">EiR grant</text>
  <rect x="285" y="110" width="80" height="14" rx="4" fill="#238636"/>
  <text x="325" y="120" class="st-badge">FUNDED</text>

  <rect x="250" y="140" width="150" height="72" rx="8" class="st-box" stroke="#e3b341"/>
  <text x="325" y="162" class="st-lab" fill="#e3b341">RISE</text>
  <text x="325" y="177" class="st-sublab">foundation · IISER Kolkata</text>
  <text x="325" y="189" class="st-sublab">incubation</text>
  <rect x="285" y="194" width="80" height="14" rx="4" fill="#9e6a03"/>
  <text x="325" y="204" class="st-badge">INCUBATED</text>

  <!-- ══ vision panel ══ -->
  <rect x="440" y="56" width="342" height="156" rx="8" class="st-box" stroke="#30363d"/>
  <text x="611" y="78" class="st-lab" fill="#79c0ff">2027 ROADMAP</text>
  <line x1="452" y1="86" x2="770" y2="86" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="104" class="st-sublab" style="text-anchor:start">▸ both ventures shipping production products</text>
  <text x="460" y="121" class="st-sublab" style="text-anchor:start">▸ DPIIT recognition — Q1 2026 target</text>
  <text x="460" y="138" class="st-sublab" style="text-anchor:start">▸ retail traders get institutional-grade ML tools</text>
  <text x="460" y="155" class="st-sublab" style="text-anchor:start">▸ marine species ID deployed with research partners</text>
  <text x="460" y="172" class="st-sublab" style="text-anchor:start">▸ finalist tracks: IIT Delhi · IIT Madras · INCI summits</text>
  <!-- progress bar: grant milestone -->
  <text x="460" y="194" class="st-sublab" style="text-anchor:start" font-size="8">grant milestone progress</text>
  <rect x="460" y="198" width="300" height="7" rx="3.5" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="460" y="198" width="0" height="7" rx="3.5" fill="#56d364">
    <animate attributeName="width" values="0;225;225" keyTimes="0;0.7;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="768" y="204" class="st-sublab" text-anchor="end" font-size="8">75%</text>

  <!-- ══ connectors with flow dots ══ -->
  <line x1="218" y1="92"  x2="250" y2="92"  stroke="#30363d" stroke-width="1.5"/>
  <line x1="218" y1="176" x2="250" y2="176" stroke="#30363d" stroke-width="1.5"/>
  <line x1="400" y1="92"  x2="440" y2="110" stroke="#30363d" stroke-width="1.5"/>
  <line x1="400" y1="176" x2="440" y2="158" stroke="#30363d" stroke-width="1.5"/>
  <circle r="3" fill="#58a6ff" filter="url(#st-glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 218,92 L 250,92"/>
  </circle>
  <circle r="3" fill="#56d364" filter="url(#st-glow)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 218,176 L 250,176"/>
  </circle>
  <circle r="3" fill="#d2a8ff" filter="url(#st-glow)">
    <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M 400,92 L 440,110"/>
  </circle>
  <circle r="3" fill="#e3b341" filter="url(#st-glow)">
    <animateMotion dur="2.4s" begin="2s" repeatCount="indefinite" path="M 400,176 L 440,158"/>
  </circle>

  <text x="400" y="224" text-anchor="middle" class="st-sub">science → product — the grant funds the bridge</text>
</svg>
