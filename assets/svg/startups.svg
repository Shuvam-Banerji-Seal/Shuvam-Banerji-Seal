<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .node-box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .node-box-blue { fill: #1e3a5f; stroke: #58a6ff; stroke-width: 2; }
      .node-box-purple { fill: #2d1f4a; stroke: #d2a8ff; stroke-width: 2; }
      .node-box-green { fill: #1f3a2d; stroke: #56d364; stroke-width: 2; }
      .node-box-orange { fill: #3a2000; stroke: #f0a830; stroke-width: 2; }
      .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #58a6ff; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
      .lbl { fill: #c9d1d9; font-family: monospace; font-size: 11px; text-anchor: middle; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 9px; text-anchor: middle; }
      .pulse-dot { animation: pd 2s ease-in-out infinite alternate; }
      @keyframes pd { 0%{opacity:.3;r:5} 100%{opacity:1;r:8} }
      .title { fill: #c9d1d9; font-family: monospace; font-size: 13px; text-anchor: middle; }
      .badge { fill: #56d364; font-family: monospace; font-size: 9px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Synapse node -->
  <rect x="20" y="50" width="140" height="80" rx="8" class="node-box-blue"/>
  <text x="90" y="78" class="lbl" style="fill:#79c0ff;font-weight:bold">Synapse</text>
  <text x="90" y="94" class="lbl">AI-Fintech</text>
  <text x="90" y="108" class="sub">Smart Trading Alerts</text>
  <text x="90" y="120" class="sub">ML · Stocks · Crypto</text>
  <circle cx="90" cy="70" r="5" fill="#58a6ff" class="pulse-dot"/>

  <!-- UnderWater AI node -->
  <rect x="20" y="160" width="140" height="80" rx="8" class="node-box-green"/>
  <text x="90" y="188" class="lbl" style="fill:#56d364;font-weight:bold">UnderWater AI</text>
  <text x="90" y="204" class="lbl">DeepTech Marine</text>
  <text x="90" y="218" class="sub">Underwater Vision</text>
  <text x="90" y="230" class="sub">Marine ID · DNN</text>
  <circle cx="90" cy="180" r="5" fill="#56d364" class="pulse-dot" style="animation-delay:.5s"/>

  <!-- MeitY badge -->
  <rect x="200" y="95" width="120" height="110" rx="8" class="node-box-purple"/>
  <text x="260" y="118" class="lbl" style="fill:#d2a8ff;font-weight:bold">MeitY</text>
  <text x="260" y="134" class="lbl">Startup Hub</text>
  <text x="260" y="150" class="sub">GENESIS Program</text>
  <text x="260" y="165" class="sub">EiR Grant</text>
  <rect x="220" y="172" width="80" height="18" rx="4" fill="#238636"/>
  <text x="260" y="184" class="badge">FUNDED</text>
  <circle cx="260" cy="108" r="5" fill="#d2a8ff" class="pulse-dot" style="animation-delay:1s"/>

  <!-- RISE Foundation -->
  <rect x="370" y="95" width="120" height="110" rx="8" class="node-box-orange"/>
  <text x="430" y="118" class="lbl" style="fill:#f0a830;font-weight:bold">RISE</text>
  <text x="430" y="134" class="lbl">Foundation</text>
  <text x="430" y="150" class="sub">IISER Kolkata</text>
  <text x="430" y="165" class="sub">Incubator</text>
  <rect x="390" y="172" width="80" height="18" rx="4" fill="#9e6a03"/>
  <text x="430" y="184" class="badge">INCUBATED</text>
  <circle cx="430" cy="108" r="5" fill="#f0a830" class="pulse-dot" style="animation-delay:1.5s"/>

  <!-- Vision box -->
  <rect x="540" y="50" width="240" height="190" rx="8" class="node-box"/>
  <text x="660" y="78" class="lbl" style="fill:#79c0ff;font-weight:bold">2027 Vision</text>
  <line x1="545" y1="87" x2="775" y2="87" stroke="#30363d" stroke-width="1"/>
  <text x="660" y="105" class="sub">Both startups shipping products 2027</text>
  <text x="660" y="121" class="sub">DPIIT registered (Q1 2026 target)</text>
  <text x="660" y="137" class="sub">Democratise ML tools for retail traders</text>
  <text x="660" y="153" class="sub">Marine species ID at scale</text>
  <text x="660" y="169" class="sub">Finalist: IIT Delhi · IIT Madras · INCI</text>
  <text x="660" y="185" class="sub">incubator summits</text>

  <!-- Arrows -->
  <line x1="160" y1="90"  x2="197" y2="130" class="arrow"/>
  <line x1="160" y1="200" x2="197" y2="170" class="arrow"/>
  <line x1="320" y1="150" x2="367" y2="150" class="arrow"/>
  <line x1="490" y1="150" x2="537" y2="150" class="arrow"/>

  <text x="400" y="248" class="title">Entrepreneurial Ventures — Synapse &amp; UnderWater AI</text>
</svg>
