<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Deep neural network forward propagation with travelling signal pulses">
  <defs>
    <filter id="nn-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .nn-title { fill:#c9d1d9; font-family:'Courier New',monospace; font-size:14px; font-weight:bold; }
      .nn-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9.5px; }
      .nn-lab   { fill:#8b949e; font-family:'Courier New',monospace; font-size:10px; text-anchor:middle; }
      .nn-edge  { stroke:#30363d; stroke-width:0.7; opacity:0.35; }
      .nn-n-in  { fill:#132241; stroke:#58a6ff; stroke-width:1.5; }
      .nn-n-h1  { fill:#241a3e; stroke:#d2a8ff; stroke-width:1.5; }
      .nn-n-h2  { fill:#12271c; stroke:#56d364; stroke-width:1.5; }
      .nn-n-h3  { fill:#0f2733; stroke:#79c0ff; stroke-width:1.5; }
      .nn-n-out { fill:#33200a; stroke:#e3b341; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="800" height="260" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="798.5" height="258.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="400" y="24" text-anchor="middle" class="nn-title">DEEP NEURAL NETWORK — FORWARD PROPAGATION</text>
  <text x="400" y="39" text-anchor="middle" class="nn-sub">signal pulses traverse the graph left to right — activations fire layer by layer</text>

  <!-- ═══ edges ═══ -->
  <!-- input(100) → h1(265) -->
  <g class="nn-edge">
    <line x1="100" y1="95"  x2="265" y2="80"/><line x1="100" y1="95"  x2="265" y2="110"/><line x1="100" y1="95"  x2="265" y2="140"/><line x1="100" y1="95"  x2="265" y2="170"/><line x1="100" y1="95"  x2="265" y2="200"/>
    <line x1="100" y1="125" x2="265" y2="80"/><line x1="100" y1="125" x2="265" y2="110"/><line x1="100" y1="125" x2="265" y2="140"/><line x1="100" y1="125" x2="265" y2="170"/><line x1="100" y1="125" x2="265" y2="200"/>
    <line x1="100" y1="155" x2="265" y2="80"/><line x1="100" y1="155" x2="265" y2="110"/><line x1="100" y1="155" x2="265" y2="140"/><line x1="100" y1="155" x2="265" y2="170"/><line x1="100" y1="155" x2="265" y2="200"/>
    <line x1="100" y1="185" x2="265" y2="80"/><line x1="100" y1="185" x2="265" y2="110"/><line x1="100" y1="185" x2="265" y2="140"/><line x1="100" y1="185" x2="265" y2="170"/><line x1="100" y1="185" x2="265" y2="200"/>
    <!-- h1(265) → h2(430) -->
    <line x1="265" y1="80"  x2="430" y2="80"/><line x1="265" y1="80"  x2="430" y2="110"/><line x1="265" y1="80"  x2="430" y2="140"/><line x1="265" y1="80"  x2="430" y2="170"/><line x1="265" y1="80"  x2="430" y2="200"/>
    <line x1="265" y1="110" x2="430" y2="80"/><line x1="265" y1="110" x2="430" y2="110"/><line x1="265" y1="110" x2="430" y2="140"/><line x1="265" y1="110" x2="430" y2="170"/><line x1="265" y1="110" x2="430" y2="200"/>
    <line x1="265" y1="140" x2="430" y2="80"/><line x1="265" y1="140" x2="430" y2="110"/><line x1="265" y1="140" x2="430" y2="140"/><line x1="265" y1="140" x2="430" y2="170"/><line x1="265" y1="140" x2="430" y2="200"/>
    <line x1="265" y1="170" x2="430" y2="80"/><line x1="265" y1="170" x2="430" y2="110"/><line x1="265" y1="170" x2="430" y2="140"/><line x1="265" y1="170" x2="430" y2="170"/><line x1="265" y1="170" x2="430" y2="200"/>
    <line x1="265" y1="200" x2="430" y2="80"/><line x1="265" y1="200" x2="430" y2="110"/><line x1="265" y1="200" x2="430" y2="140"/><line x1="265" y1="200" x2="430" y2="170"/><line x1="265" y1="200" x2="430" y2="200"/>
    <!-- h2(430) → h3(595) -->
    <line x1="430" y1="80"  x2="595" y2="95"/><line x1="430" y1="80"  x2="595" y2="125"/><line x1="430" y1="80"  x2="595" y2="155"/><line x1="430" y1="80"  x2="595" y2="185"/>
    <line x1="430" y1="110" x2="595" y2="95"/><line x1="430" y1="110" x2="595" y2="125"/><line x1="430" y1="110" x2="595" y2="155"/><line x1="430" y1="110" x2="595" y2="185"/>
    <line x1="430" y1="140" x2="595" y2="95"/><line x1="430" y1="140" x2="595" y2="125"/><line x1="430" y1="140" x2="595" y2="155"/><line x1="430" y1="140" x2="595" y2="185"/>
    <line x1="430" y1="170" x2="595" y2="95"/><line x1="430" y1="170" x2="595" y2="125"/><line x1="430" y1="170" x2="595" y2="155"/><line x1="430" y1="170" x2="595" y2="185"/>
    <line x1="430" y1="200" x2="595" y2="95"/><line x1="430" y1="200" x2="595" y2="125"/><line x1="430" y1="200" x2="595" y2="155"/><line x1="430" y1="200" x2="595" y2="185"/>
    <!-- h3(595) → out(735) -->
    <line x1="595" y1="95"  x2="735" y2="125"/><line x1="595" y1="95"  x2="735" y2="155"/>
    <line x1="595" y1="125" x2="735" y2="125"/><line x1="595" y1="125" x2="735" y2="155"/>
    <line x1="595" y1="155" x2="735" y2="125"/><line x1="595" y1="155" x2="735" y2="155"/>
    <line x1="595" y1="185" x2="735" y2="125"/><line x1="595" y1="185" x2="735" y2="155"/>
  </g>

  <!-- ═══ signal pulses (one wave, 3s loop, staggered per gap) ═══ -->
  <g filter="url(#nn-glow)">
    <!-- gap 1 -->
    <circle r="3" fill="#58a6ff"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 100,140 L 265,140"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#58a6ff"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 100,95 L 265,110"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#58a6ff"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 100,185 L 265,170"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <!-- gap 2 -->
    <circle r="3" fill="#d2a8ff"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 265,110 L 430,110"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#d2a8ff"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 265,170 L 430,170"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#d2a8ff"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 265,200 L 430,140"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <!-- gap 3 -->
    <circle r="3" fill="#56d364"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 430,140 L 595,125"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#56d364"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 430,80 L 595,95"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#56d364"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 430,200 L 595,185"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <!-- gap 4 -->
    <circle r="3.5" fill="#e3b341"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M 595,125 L 735,140"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.15;0.2;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ nodes ═══ -->
  <!-- input -->
  <g>
    <circle cx="100" cy="95"  r="11" class="nn-n-in"/><circle cx="100" cy="95"  r="4.5" fill="#58a6ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="125" r="11" class="nn-n-in"/><circle cx="100" cy="125" r="4.5" fill="#58a6ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="155" r="11" class="nn-n-in"/><circle cx="100" cy="155" r="4.5" fill="#58a6ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="185" r="11" class="nn-n-in"/><circle cx="100" cy="185" r="4.5" fill="#58a6ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- h1 -->
  <g>
    <circle cx="265" cy="80"  r="11" class="nn-n-h1"/><circle cx="265" cy="80"  r="4.5" fill="#d2a8ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="110" r="11" class="nn-n-h1"/><circle cx="265" cy="110" r="4.5" fill="#d2a8ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="140" r="11" class="nn-n-h1"/><circle cx="265" cy="140" r="4.5" fill="#d2a8ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="170" r="11" class="nn-n-h1"/><circle cx="265" cy="170" r="4.5" fill="#d2a8ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="200" r="11" class="nn-n-h1"/><circle cx="265" cy="200" r="4.5" fill="#d2a8ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
  <!-- h2 -->
  <g>
    <circle cx="430" cy="80"  r="11" class="nn-n-h2"/><circle cx="430" cy="80"  r="4.5" fill="#56d364"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="110" r="11" class="nn-n-h2"/><circle cx="430" cy="110" r="4.5" fill="#56d364"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="140" r="11" class="nn-n-h2"/><circle cx="430" cy="140" r="4.5" fill="#56d364"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="170" r="11" class="nn-n-h2"/><circle cx="430" cy="170" r="4.5" fill="#56d364"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="200" r="11" class="nn-n-h2"/><circle cx="430" cy="200" r="4.5" fill="#56d364"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- h3 -->
  <g>
    <circle cx="595" cy="95"  r="11" class="nn-n-h3"/><circle cx="595" cy="95"  r="4.5" fill="#79c0ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="595" cy="125" r="11" class="nn-n-h3"/><circle cx="595" cy="125" r="4.5" fill="#79c0ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="595" cy="155" r="11" class="nn-n-h3"/><circle cx="595" cy="155" r="4.5" fill="#79c0ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="595" cy="185" r="11" class="nn-n-h3"/><circle cx="595" cy="185" r="4.5" fill="#79c0ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- output -->
  <g filter="url(#nn-glow)">
    <circle cx="735" cy="125" r="13" class="nn-n-out"/><circle cx="735" cy="125" r="5.5" fill="#e3b341"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="r" values="4.5;7;4.5" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="735" cy="155" r="13" class="nn-n-out"/><circle cx="735" cy="155" r="5.5" fill="#e3b341"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="r" values="4.5;7;4.5" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- labels -->
  <text x="100" y="228" class="nn-lab">Input (4)</text>
  <text x="265" y="228" class="nn-lab">Hidden 1 (5)</text>
  <text x="430" y="228" class="nn-lab">Hidden 2 (5)</text>
  <text x="595" y="228" class="nn-lab">Hidden 3 (4)</text>
  <text x="735" y="228" class="nn-lab">Output (2)</text>
  <text x="400" y="250" text-anchor="middle" class="nn-sub">ReLU activations · softmax output · encoder fine-tuned for domain-specific retrieval</text>
</svg>
