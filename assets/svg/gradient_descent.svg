<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="loss-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text x="260" y="22" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Gradient Descent Loss Landscape</text>
  <text x="260" y="37" text-anchor="middle" fill="#8b949e" font-size="10">Adam optimizer — RAG encoder fine-tuning</text>

  <!-- Axes -->
  <line x1="50" y1="240" x2="490" y2="240" stroke="#30363d" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="50" y2="240" stroke="#30363d" stroke-width="1.5"/>
  <text x="270" y="258" text-anchor="middle" fill="#8b949e" font-size="10">Training Steps →</text>
  <text x="16" y="150" fill="#8b949e" font-size="10" transform="rotate(-90,16,150)">Loss</text>

  <!-- Grid lines -->
  <line x1="50" y1="80" x2="490" y2="80" stroke="#161b22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="120" x2="490" y2="120" stroke="#161b22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="160" x2="490" y2="160" stroke="#161b22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="50" y1="200" x2="490" y2="200" stroke="#161b22" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="44" y="83" fill="#8b949e" font-size="8" text-anchor="end">2.0</text>
  <text x="44" y="123" fill="#8b949e" font-size="8" text-anchor="end">1.5</text>
  <text x="44" y="163" fill="#8b949e" font-size="8" text-anchor="end">1.0</text>
  <text x="44" y="203" fill="#8b949e" font-size="8" text-anchor="end">0.5</text>

  <!-- X-axis ticks -->
  <text x="50"  y="253" fill="#8b949e" font-size="8" text-anchor="middle">0</text>
  <text x="160" y="253" fill="#8b949e" font-size="8" text-anchor="middle">500</text>
  <text x="270" y="253" fill="#8b949e" font-size="8" text-anchor="middle">1k</text>
  <text x="380" y="253" fill="#8b949e" font-size="8" text-anchor="middle">1.5k</text>
  <text x="490" y="253" fill="#8b949e" font-size="8" text-anchor="middle">2k</text>

  <!-- Training loss curve (filled area then line) -->
  <path d="M50,60 C80,62 100,90 130,120 C160,148 190,170 220,185 C250,196 280,205 310,210 C340,215 370,218 400,220 C430,221 460,222 490,222 L490,240 L50,240 Z" fill="url(#loss-grad)" opacity="0.4"/>
  <path d="M50,60 C80,62 100,90 130,120 C160,148 190,170 220,185 C250,196 280,205 310,210 C340,215 370,218 400,220 C430,221 460,222 490,222" fill="none" stroke="#ff7b72" stroke-width="2"/>

  <!-- Validation loss curve -->
  <path d="M50,65 C80,70 100,100 130,132 C160,160 190,178 220,190 C250,200 280,207 310,212 C340,216 370,221 400,226 C420,228 450,232 490,236" fill="none" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Animated position dot on training curve -->
  <circle r="6" fill="#ff7b72" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" keyTimes="0;0.08;0.15;0.25;0.38;0.55;0.72;0.9;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1">
      <mpath href="#train-path"/>
    </animateMotion>
  </circle>
  <path id="train-path" d="M50,60 C80,62 100,90 130,120 C160,148 190,170 220,185 C250,196 280,205 310,210 C340,215 370,218 400,220 C430,221 460,222 490,222" fill="none"/>

  <!-- Gradient step arrows -->
  <line x1="130" y1="120" x2="162" y2="147" stroke="#56d364" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <line x1="220" y1="185" x2="252" y2="196" stroke="#56d364" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <line x1="310" y1="210" x2="342" y2="214" stroke="#56d364" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <defs>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#56d364"/>
    </marker>
  </defs>
  <text x="155" y="116" fill="#56d364" font-size="8">-∇L</text>

  <!-- local minimum annotation -->
  <line x1="310" y1="198" x2="310" y2="175" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="314" y="173" fill="#d2a8ff" font-size="9">local min</text>

  <!-- global minimum annotation -->
  <line x1="480" y1="220" x2="480" y2="197" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="420" y="195" fill="#58a6ff" font-size="9">global min</text>

  <!-- Legend -->
  <line x1="310" y1="60" x2="340" y2="60" stroke="#ff7b72" stroke-width="2"/>
  <text x="344" y="64" fill="#ff7b72" font-size="9">Train Loss</text>
  <line x1="310" y1="76" x2="340" y2="76" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="344" y="80" fill="#e3b341" font-size="9">Val Loss</text>
</svg>
