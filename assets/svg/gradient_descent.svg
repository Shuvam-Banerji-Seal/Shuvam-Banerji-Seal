<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Gradient descent loss landscape with descending optimizer dot">
  <defs>
    <filter id="gd-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gd-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <marker id="gd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#56d364"/>
    </marker>
    <style>
      .gd-title { fill:#58a6ff; font-family:'Courier New',monospace; font-size:12.5px; font-weight:bold; text-anchor:middle; }
      .gd-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:8.5px; text-anchor:middle; }
      .gd-ax    { fill:#8b949e; font-family:'Courier New',monospace; font-size:8px; }
    </style>
  </defs>

  <rect width="400" height="280" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="398.5" height="278.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="200" y="22" class="gd-title">GRADIENT DESCENT — LOSS LANDSCAPE</text>
  <text x="200" y="35" class="gd-sub">Adam · RAG encoder fine-tuning</text>

  <!-- grid -->
  <g stroke="#161b22" stroke-width="1" stroke-dasharray="3,4">
    <line x1="40" y1="85"  x2="380" y2="85"/>
    <line x1="40" y1="125" x2="380" y2="125"/>
    <line x1="40" y1="165" x2="380" y2="165"/>
    <line x1="40" y1="205" x2="380" y2="205"/>
  </g>

  <!-- axes -->
  <line x1="40" y1="230" x2="380" y2="230" stroke="#30363d" stroke-width="1.5"/>
  <line x1="40" y1="55"  x2="40"  y2="230" stroke="#30363d" stroke-width="1.5"/>
  <text x="210" y="246" text-anchor="middle" class="gd-ax">TRAINING STEPS →</text>
  <text x="18" y="145" class="gd-ax" transform="rotate(-90,18,145)" text-anchor="middle">LOSS</text>
  <text x="36" y="88"  class="gd-ax" text-anchor="end">2.0</text>
  <text x="36" y="128" class="gd-ax" text-anchor="end">1.5</text>
  <text x="36" y="168" class="gd-ax" text-anchor="end">1.0</text>
  <text x="36" y="208" class="gd-ax" text-anchor="end">0.5</text>
  <text x="40"  y="240" class="gd-ax" text-anchor="middle">0</text>
  <text x="380" y="240" class="gd-ax" text-anchor="middle">2k</text>

  <!-- train loss -->
  <path d="M40,68 C70,70 90,98 115,128 C140,156 165,176 190,190 C215,200 245,208 275,212 C305,215 340,216 380,217 L380,230 L40,230 Z" fill="url(#gd-fill)" opacity="0.5"/>
  <path id="gd-train" d="M40,68 C70,70 90,98 115,128 C140,156 165,176 190,190 C215,200 245,208 275,212 C305,215 340,216 380,217" fill="none" stroke="#ff7b72" stroke-width="2"/>

  <!-- val loss -->
  <path d="M40,74 C70,80 90,110 115,140 C140,166 165,184 190,195 C215,204 245,210 275,214 C305,218 340,222 380,226" fill="none" stroke="#e3b341" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- travelling optimizer dot -->
  <circle r="5.5" fill="#ff7b72" filter="url(#gd-glow)">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1">
      <mpath href="#gd-train" xlink:href="#gd-train"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#ff7b72" opacity="0.4">
    <animateMotion dur="5s" begin="-0.2s" repeatCount="indefinite">
      <mpath href="#gd-train" xlink:href="#gd-train"/>
    </animateMotion>
  </circle>

  <!-- gradient steps -->
  <line x1="115" y1="128" x2="147" y2="155" stroke="#56d364" stroke-width="1.5" marker-end="url(#gd-arrow)"/>
  <line x1="190" y1="190" x2="222" y2="201" stroke="#56d364" stroke-width="1.5" marker-end="url(#gd-arrow)"/>
  <text x="122" y="122" fill="#56d364" font-size="8.5" font-family="monospace">−∇L</text>

  <!-- annotations -->
  <line x1="275" y1="206" x2="275" y2="186" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="279" y="184" fill="#d2a8ff" font-size="8" font-family="monospace">plateau</text>
  <line x1="370" y1="215" x2="370" y2="196" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="316" y="192" fill="#58a6ff" font-size="8" font-family="monospace">convergence</text>

  <!-- legend -->
  <line x1="228" y1="52" x2="252" y2="52" stroke="#ff7b72" stroke-width="2"/>
  <text x="256" y="55" class="gd-ax">train</text>
  <line x1="290" y1="52" x2="314" y2="52" stroke="#e3b341" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="318" y="55" class="gd-ax">val</text>

  <text x="200" y="264" text-anchor="middle" class="gd-sub">lr = 2e-5 · warmup 500 · cosine decay — escape plateaus, trust the valley</text>
</svg>
