<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Molecular docking wave">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131f"/>
      <stop offset="100%" stop-color="#10253b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="280" fill="url(#bg5)"/>

  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75">
    <path d="M20 170 Q120 80 220 170 T420 170 T620 170 T820 170 T940 170">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M20 170 Q120 80 220 170 T420 170 T620 170 T820 170 T940 170;
              M20 150 Q120 240 220 150 T420 150 T620 150 T820 150 T940 150;
              M20 170 Q120 80 220 170 T420 170 T620 170 T820 170 T940 170"/>
    </path>
  </g>

  <g fill="#fca5a5" stroke="#fecaca" stroke-width="1.4">
    <circle cx="220" cy="135" r="16"/>
    <circle cx="255" cy="160" r="11"/>
    <circle cx="190" cy="165" r="10"/>
    <line x1="220" y1="135" x2="255" y2="160"/>
    <line x1="220" y1="135" x2="190" y2="165"/>
  </g>

  <g fill="#93c5fd" stroke="#bfdbfe" stroke-width="1.4">
    <circle cx="700" cy="130" r="14"/>
    <circle cx="740" cy="152" r="10"/>
    <circle cx="668" cy="156" r="10"/>
    <line x1="700" y1="130" x2="740" y2="152"/>
    <line x1="700" y1="130" x2="668" y2="156"/>
  </g>

  <g>
    <circle cx="360" cy="148" r="7" fill="#a7f3d0">
      <animate attributeName="cx" values="300;660;300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="148;140;148" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="36" y="252" fill="#dbeafe" font-family="monospace" font-size="18">Molecular Docking Signal Channel</text>
</svg>