<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gradient descent animation">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="960" height="280" fill="url(#bg3)"/>

  <path d="M40 40 C220 230, 350 240, 480 150 C620 60, 720 200, 920 80" fill="none" stroke="url(#curve)" stroke-width="5"/>
  <circle r="10" fill="#f9a8d4">
    <animateMotion dur="8s" repeatCount="indefinite" path="M40 40 C220 230, 350 240, 480 150 C620 60, 720 200, 920 80"/>
  </circle>
  <circle r="6" fill="#67e8f9" opacity="0.8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M80 60 C260 230, 360 230, 500 155 C640 80, 760 190, 900 90"/>
  </circle>

  <g stroke="#334155" stroke-width="1">
    <line x1="40" y1="240" x2="920" y2="240"/>
    <line x1="40" y1="20" x2="40" y2="240"/>
  </g>

  <text x="55" y="45" fill="#94a3b8" font-family="monospace" font-size="14">Loss</text>
  <text x="890" y="260" fill="#94a3b8" font-family="monospace" font-size="14">Epoch</text>
  <text x="34" y="262" fill="#cbd5e1" font-family="monospace" font-size="18">Gradient Descent Over Non-Convex Surface</text>
</svg>