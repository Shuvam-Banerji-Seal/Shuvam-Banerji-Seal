<svg viewBox="0 0 540 300" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:monospace">
  <!--
    STORY: DFT maps electron density into atomic orbitals.
    Left: spherical 1s (no angular nodes).
    Centre: dumbbell 2p (one angular node at the nucleus).
    Right: dz² 3d (two lobes + equatorial torus — two angular nodes).
  -->
  <defs>
    <radialGradient id="nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sgrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ptop" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbot" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dlobe" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Titles -->
  <text x="270" y="18" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">DFT Orbital Visualisation — B3LYP/6-311G*</text>
  <text x="270" y="32" text-anchor="middle" fill="#8b949e" font-size="9">[VO(SALIEP)(DTP)] — s, p, d electron density probability</text>

  <!-- ══ LEFT — 1s orbital ══ -->
  <text x="90" y="54" text-anchor="middle" fill="#56d364" font-size="11" font-weight="bold">1s orbital</text>
  <text x="90" y="66" text-anchor="middle" fill="#8b949e" font-size="9">n=1  l=0  m=0</text>
  <!-- shells -->
  <circle cx="90" cy="165" r="68" fill="url(#sgrad)" opacity="0.18"><animate attributeName="r" values="62;72;62" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="165" r="50" fill="url(#sgrad)" opacity="0.38"><animate attributeName="r" values="44;54;44" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="165" r="28" fill="url(#sgrad)" opacity="0.60"><animate attributeName="r" values="24;32;24" dur="3s" repeatCount="indefinite"/></circle>
  <!-- nucleus -->
  <circle cx="90" cy="165" r="7" fill="url(#nuc)"><animate attributeName="r" values="6;9;6" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- orbiting electron — two 180° arcs = clean circle of radius 38 centred at (90,165) -->
  <circle r="4.5" fill="#56d364" cx="52" cy="165">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M 52,165 A 38,38 0 0 1 128,165 A 38,38 0 0 1 52,165"/>
  </circle>
  <text x="90" y="254" text-anchor="middle" fill="#56d364" font-size="9">Spherical — no angular nodes</text>

  <!-- divider -->
  <line x1="180" y1="50" x2="180" y2="272" stroke="#30363d" stroke-width="1"/>

  <!-- ══ CENTRE — 2p orbital ══ -->
  <text x="270" y="54" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">2p orbital (pz)</text>
  <text x="270" y="66" text-anchor="middle" fill="#8b949e" font-size="9">n=2  l=1  m=0 — 1 angular node</text>
  <!-- upper lobe -->
  <ellipse cx="270" cy="125" rx="32" ry="50" fill="url(#ptop)" opacity="0.82">
    <animate attributeName="ry" values="44;54;44" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <text x="270" y="90" text-anchor="middle" fill="#58a6ff" font-size="10">+ψ</text>
  <!-- lower lobe -->
  <ellipse cx="270" cy="205" rx="32" ry="50" fill="url(#pbot)" opacity="0.72">
    <animate attributeName="ry" values="44;54;44" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </ellipse>
  <text x="270" y="248" text-anchor="middle" fill="#d2a8ff" font-size="10">−ψ</text>
  <!-- nodal plane -->
  <line x1="225" y1="165" x2="315" y2="165" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="318" y="168" fill="#e3b341" font-size="9">node</text>
  <!-- nucleus -->
  <circle cx="270" cy="165" r="6" fill="url(#nuc)"><animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- upper-lobe orbit: circle of rx=26,ry=44 centred at (270,125) — two arcs -->
  <circle r="4" fill="#58a6ff" cx="296" cy="125">
    <animateMotion dur="3.8s" repeatCount="indefinite"
      path="M 296,125 A 26,44 0 0 1 244,125 A 26,44 0 0 1 296,125"/>
  </circle>
  <!-- lower-lobe orbit -->
  <circle r="3.5" fill="#d2a8ff" cx="296" cy="205" opacity="0.8">
    <animateMotion dur="3.8s" begin="1.9s" repeatCount="indefinite"
      path="M 296,205 A 26,44 0 0 0 244,205 A 26,44 0 0 0 296,205"/>
  </circle>
  <text x="270" y="268" text-anchor="middle" fill="#8b949e" font-size="9">Phase alternates across nodal plane</text>

  <!-- divider -->
  <line x1="360" y1="50" x2="360" y2="272" stroke="#30363d" stroke-width="1"/>

  <!-- ══ RIGHT — 3d (dz²) orbital ══ -->
  <text x="450" y="54" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold">3d orbital (dz²)</text>
  <text x="450" y="66" text-anchor="middle" fill="#8b949e" font-size="9">n=3  l=2  m=0 — 2 angular nodes</text>
  <!-- upper lobe -->
  <ellipse cx="450" cy="117" rx="26" ry="44" fill="url(#dlobe)" opacity="0.88">
    <animate attributeName="ry" values="40;50;40" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="450" y="83" text-anchor="middle" fill="#e3b341" font-size="10">+ψ</text>
  <!-- lower lobe -->
  <ellipse cx="450" cy="213" rx="26" ry="44" fill="url(#dlobe)" opacity="0.88">
    <animate attributeName="ry" values="40;50;40" dur="2s" begin="1s" repeatCount="indefinite"/>
  </ellipse>
  <text x="450" y="248" text-anchor="middle" fill="#e3b341" font-size="10">+ψ</text>
  <!-- torus ring -->
  <ellipse cx="450" cy="165" rx="46" ry="13" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff" stroke-width="2">
    <animate attributeName="rx" values="42;50;42" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="450" y="190" text-anchor="middle" fill="#d2a8ff" font-size="9">−ψ ring</text>
  <!-- nodal-cone lines -->
  <line x1="450" y1="165" x2="406" y2="96" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="450" y1="165" x2="494" y2="96" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="450" y1="165" x2="406" y2="234" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="450" y1="165" x2="494" y2="234" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <!-- nucleus -->
  <circle cx="450" cy="165" r="6" fill="url(#nuc)"><animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- torus electron: ellipse cx=450 cy=165 rx=46 ry=13 — two arcs -->
  <circle r="4" fill="#e3b341" cx="496" cy="165">
    <animateMotion dur="2.6s" repeatCount="indefinite"
      path="M 496,165 A 46,13 0 0 1 404,165 A 46,13 0 0 1 496,165"/>
  </circle>
  <!-- upper-lobe electron -->
  <circle r="3" fill="#e3b341" cx="476" cy="117" opacity="0.75">
    <animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite"
      path="M 476,117 A 26,44 0 0 0 424,117 A 26,44 0 0 0 476,117"/>
  </circle>
  <text x="450" y="268" text-anchor="middle" fill="#8b949e" font-size="9">Torus = equatorial −ψ lobe</text>

  <!-- Energy axis -->
  <line x1="14" y1="248" x2="14" y2="78" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="10,78 14,70 18,78" fill="#8b949e"/>
  <text x="9" y="163" fill="#8b949e" font-size="9" transform="rotate(-90,9,163)">Energy</text>
  <line x1="10" y1="238" x2="18" y2="238" stroke="#56d364" stroke-width="1.5"/><text x="22" y="242" fill="#56d364" font-size="8">n=1</text>
  <line x1="10" y1="188" x2="18" y2="188" stroke="#58a6ff" stroke-width="1.5"/><text x="22" y="192" fill="#58a6ff" font-size="8">n=2</text>
  <line x1="10" y1="135" x2="18" y2="135" stroke="#e3b341" stroke-width="1.5"/><text x="22" y="139" fill="#e3b341" font-size="8">n=3</text>
</svg>
