<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="DFT orbital visualisation: 1s, 2p and 3d orbitals with animated electrons">
  <!--
    STORY: DFT maps electron density into atomic orbitals.
    Left: spherical 1s (no angular nodes). Centre: dumbbell 2p (one angular node).
    Right: dz2 3d (two lobes + equatorial torus — two angular nodes).
  -->
  <defs>
    <radialGradient id="dft-nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dft-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dft-ptop" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dft-pbot" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dft-d" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <filter id="dft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dft-title { fill:#58a6ff; font-family:'Courier New',monospace; font-size:14px; font-weight:bold; }
      .dft-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9.5px; }
      .dft-name  { font-family:'Courier New',monospace; font-size:11.5px; font-weight:bold; }
      .dft-qnum  { fill:#8b949e; font-family:'Courier New',monospace; font-size:9px; }
      .dft-cap   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9px; }
      .dft-psi   { font-family:'Courier New',monospace; font-size:10px; }
    </style>
  </defs>

  <rect width="800" height="260" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="798.5" height="258.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="400" y="24" text-anchor="middle" class="dft-title">DFT ORBITAL VISUALISATION — B3LYP / 6-311G*</text>
  <text x="400" y="39" text-anchor="middle" class="dft-sub">[VO(SALIEP)(DTP)] — electron-density probability for s, p and d shells</text>

  <!-- energy axis -->
  <line x1="34" y1="212" x2="34" y2="72" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="30,74 34,66 38,74" fill="#8b949e"/>
  <text x="28" y="145" fill="#8b949e" font-size="9" font-family="monospace" transform="rotate(-90,28,145)">ENERGY</text>
  <line x1="30" y1="204" x2="38" y2="204" stroke="#56d364" stroke-width="1.5"/><text x="42" y="207" fill="#56d364" font-size="8" font-family="monospace">n=1</text>
  <line x1="30" y1="140" x2="38" y2="140" stroke="#58a6ff" stroke-width="1.5"/><text x="42" y="143" fill="#58a6ff" font-size="8" font-family="monospace">n=2</text>
  <line x1="30" y1="78"  x2="38" y2="78"  stroke="#e3b341" stroke-width="1.5"/><text x="42" y="81" fill="#e3b341" font-size="8" font-family="monospace">n=3</text>

  <!-- ══ LEFT — 1s ══ -->
  <text x="160" y="62" text-anchor="middle" class="dft-name" fill="#56d364">1s ORBITAL</text>
  <text x="160" y="75" text-anchor="middle" class="dft-qnum">n=1 · l=0 · m=0</text>
  <circle cx="160" cy="148" r="66" fill="url(#dft-s)" opacity="0.16"><animate attributeName="r" values="60;70;60" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="148" r="48" fill="url(#dft-s)" opacity="0.36"><animate attributeName="r" values="43;53;43" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="148" r="27" fill="url(#dft-s)" opacity="0.6"><animate attributeName="r" values="23;31;23" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="148" r="7" fill="url(#dft-nuc)"><animate attributeName="r" values="6;9;6" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- electron + trail on r=38 ring -->
  <circle r="4.5" fill="#56d364" filter="url(#dft-glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 198,148 A 38,38 0 0 1 122,148 A 38,38 0 0 1 198,148"/>
  </circle>
  <circle r="3" fill="#56d364" opacity="0.35">
    <animateMotion dur="3s" begin="-0.15s" repeatCount="indefinite" path="M 198,148 A 38,38 0 0 1 122,148 A 38,38 0 0 1 198,148"/>
  </circle>
  <circle r="2.2" fill="#56d364" opacity="0.15">
    <animateMotion dur="3s" begin="-0.3s" repeatCount="indefinite" path="M 198,148 A 38,38 0 0 1 122,148 A 38,38 0 0 1 198,148"/>
  </circle>
  <text x="160" y="234" text-anchor="middle" class="dft-cap">spherical — no angular nodes</text>

  <line x1="272" y1="56" x2="272" y2="240" stroke="#30363d" stroke-width="1"/>

  <!-- ══ CENTRE — 2p ══ -->
  <text x="400" y="62" text-anchor="middle" class="dft-name" fill="#58a6ff">2p ORBITAL (pz)</text>
  <text x="400" y="75" text-anchor="middle" class="dft-qnum">n=2 · l=1 · m=0 — 1 angular node</text>
  <ellipse cx="400" cy="110" rx="34" ry="48" fill="url(#dft-ptop)" opacity="0.85">
    <animate attributeName="ry" values="42;52;42" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <text x="400" y="80" text-anchor="middle" class="dft-psi" fill="#58a6ff">+ψ</text>
  <ellipse cx="400" cy="186" rx="34" ry="48" fill="url(#dft-pbot)" opacity="0.75">
    <animate attributeName="ry" values="42;52;42" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </ellipse>
  <text x="400" y="226" text-anchor="middle" class="dft-psi" fill="#d2a8ff">−ψ</text>
  <line x1="352" y1="148" x2="448" y2="148" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.75"/>
  <text x="452" y="151" fill="#e3b341" font-size="9" font-family="monospace">node</text>
  <circle cx="400" cy="148" r="6" fill="url(#dft-nuc)"><animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- upper-lobe electron (rx=26, ry=42 around 400,110) -->
  <circle r="4" fill="#58a6ff" filter="url(#dft-glow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M 426,110 A 26,42 0 0 1 374,110 A 26,42 0 0 1 426,110"/>
  </circle>
  <!-- lower-lobe electron -->
  <circle r="3.5" fill="#d2a8ff" opacity="0.85">
    <animateMotion dur="3.8s" begin="1.9s" repeatCount="indefinite" path="M 426,186 A 26,42 0 0 0 374,186 A 26,42 0 0 0 426,186"/>
  </circle>
  <text x="400" y="234" text-anchor="middle" class="dft-cap">phase alternates across nodal plane</text>

  <line x1="512" y1="56" x2="512" y2="240" stroke="#30363d" stroke-width="1"/>

  <!-- ══ RIGHT — 3d dz2 ══ -->
  <text x="648" y="62" text-anchor="middle" class="dft-name" fill="#e3b341">3d ORBITAL (dz²)</text>
  <text x="648" y="75" text-anchor="middle" class="dft-qnum">n=3 · l=2 · m=0 — 2 angular nodes</text>
  <ellipse cx="648" cy="104" rx="27" ry="42" fill="url(#dft-d)" opacity="0.9">
    <animate attributeName="ry" values="38;48;38" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="648" y="74" text-anchor="middle" class="dft-psi" fill="#e3b341">+ψ</text>
  <ellipse cx="648" cy="192" rx="27" ry="42" fill="url(#dft-d)" opacity="0.9">
    <animate attributeName="ry" values="38;48;38" dur="2s" begin="1s" repeatCount="indefinite"/>
  </ellipse>
  <text x="648" y="230" text-anchor="middle" class="dft-psi" fill="#e3b341">+ψ</text>
  <!-- torus -->
  <ellipse cx="648" cy="148" rx="46" ry="13" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff" stroke-width="2">
    <animate attributeName="rx" values="42;50;42" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="648" y="166" text-anchor="middle" fill="#d2a8ff" font-size="9" font-family="monospace">−ψ ring</text>
  <!-- nodal cones -->
  <line x1="648" y1="148" x2="606" y2="84"  stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
  <line x1="648" y1="148" x2="690" y2="84"  stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
  <line x1="648" y1="148" x2="606" y2="212" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
  <line x1="648" y1="148" x2="690" y2="212" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
  <circle cx="648" cy="148" r="6" fill="url(#dft-nuc)"><animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/></circle>
  <!-- torus electron -->
  <circle r="4" fill="#e3b341" filter="url(#dft-glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 694,148 A 46,13 0 0 1 602,148 A 46,13 0 0 1 694,148"/>
  </circle>
  <!-- upper-lobe electron -->
  <circle r="3" fill="#e3b341" opacity="0.75">
    <animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M 674,104 A 26,42 0 0 0 622,104 A 26,42 0 0 0 674,104"/>
  </circle>
  <text x="648" y="234" text-anchor="middle" class="dft-cap">torus = equatorial −ψ lobe</text>

  <text x="400" y="252" text-anchor="middle" class="dft-sub">computed with Gaussian — B3LYP functional · 6-311G(d,p) basis · water-reduction catalyst study</text>
</svg>
