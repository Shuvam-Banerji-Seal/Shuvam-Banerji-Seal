<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Spiking neural network pulse propagating through layers">
  <!--
    FIX LOG vs v1: old version animated fill between two gradient url() values via
    SMIL — paint servers do not interpolate, so the effect was renderer-dependent.
    Replaced with stacked lit-overlay circles pulsing opacity (works everywhere).
  -->
  <defs>
    <radialGradient id="np-lit" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#1f6feb" stop-opacity="0.1"/></radialGradient>
    <radialGradient id="np-dim" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#30363d"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
    <filter id="np-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .np-title { fill:#58a6ff; font-family:'Courier New',monospace; font-size:12.5px; font-weight:bold; text-anchor:middle; }
      .np-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:8.5px; text-anchor:middle; }
      .np-lab   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9px; text-anchor:middle; }
      .np-edge  { stroke:#30363d; stroke-width:0.7; opacity:0.45; }
    </style>
  </defs>

  <rect width="400" height="280" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="398.5" height="278.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="200" y="22" class="np-title">NEURAL ACTIVATION PULSE</text>
  <text x="200" y="35" class="np-sub">spiking feed-forward network — the spike travels, layers light in sequence</text>

  <!-- edges -->
  <g class="np-edge">
    <line x1="50"  y1="115" x2="160" y2="100"/><line x1="50"  y1="115" x2="160" y2="130"/><line x1="50"  y1="115" x2="160" y2="160"/><line x1="50"  y1="115" x2="160" y2="190"/>
    <line x1="50"  y1="150" x2="160" y2="100"/><line x1="50"  y1="150" x2="160" y2="130"/><line x1="50"  y1="150" x2="160" y2="160"/><line x1="50"  y1="150" x2="160" y2="190"/>
    <line x1="50"  y1="185" x2="160" y2="100"/><line x1="50"  y1="185" x2="160" y2="130"/><line x1="50"  y1="185" x2="160" y2="160"/><line x1="50"  y1="185" x2="160" y2="190"/>
    <line x1="160" y1="100" x2="270" y2="100"/><line x1="160" y1="100" x2="270" y2="130"/><line x1="160" y1="100" x2="270" y2="160"/><line x1="160" y1="100" x2="270" y2="190"/>
    <line x1="160" y1="130" x2="270" y2="100"/><line x1="160" y1="130" x2="270" y2="130"/><line x1="160" y1="130" x2="270" y2="160"/><line x1="160" y1="130" x2="270" y2="190"/>
    <line x1="160" y1="160" x2="270" y2="100"/><line x1="160" y1="160" x2="270" y2="130"/><line x1="160" y1="160" x2="270" y2="160"/><line x1="160" y1="160" x2="270" y2="190"/>
    <line x1="160" y1="190" x2="270" y2="100"/><line x1="160" y1="190" x2="270" y2="130"/><line x1="160" y1="190" x2="270" y2="160"/><line x1="160" y1="190" x2="270" y2="190"/>
    <line x1="270" y1="100" x2="355" y2="130"/><line x1="270" y1="100" x2="355" y2="170"/>
    <line x1="270" y1="130" x2="355" y2="130"/><line x1="270" y1="130" x2="355" y2="170"/>
    <line x1="270" y1="160" x2="355" y2="130"/><line x1="270" y1="160" x2="355" y2="170"/>
    <line x1="270" y1="190" x2="355" y2="130"/><line x1="270" y1="190" x2="355" y2="170"/>
  </g>

  <!-- travelling spike -->
  <circle r="5" fill="#58a6ff" filter="url(#np-glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;0.33;0.66;1;1" keyTimes="0;0.3;0.6;0.85;1" calcMode="linear" path="M50,150 L160,145 L270,145 L355,150"/>
  </circle>

  <!-- input layer (3) -->
  <g>
    <circle cx="50" cy="115" r="12" fill="url(#np-dim)"/><circle cx="50" cy="115" r="12" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="150" r="12" fill="url(#np-dim)"/><circle cx="50" cy="150" r="12" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.08s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="185" r="12" fill="url(#np-dim)"/><circle cx="50" cy="185" r="12" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.16s" repeatCount="indefinite"/></circle>
  </g>
  <!-- h1 (4) -->
  <g>
    <circle cx="160" cy="100" r="11" fill="url(#np-dim)"/><circle cx="160" cy="100" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="130" r="11" fill="url(#np-dim)"/><circle cx="160" cy="130" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.78s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="160" r="11" fill="url(#np-dim)"/><circle cx="160" cy="160" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.86s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="190" r="11" fill="url(#np-dim)"/><circle cx="160" cy="190" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="0.94s" repeatCount="indefinite"/></circle>
  </g>
  <!-- h2 (4) -->
  <g>
    <circle cx="270" cy="100" r="11" fill="url(#np-dim)"/><circle cx="270" cy="100" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="130" r="11" fill="url(#np-dim)"/><circle cx="270" cy="130" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="1.48s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="160" r="11" fill="url(#np-dim)"/><circle cx="270" cy="160" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="1.56s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="190" r="11" fill="url(#np-dim)"/><circle cx="270" cy="190" r="11" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="1.64s" repeatCount="indefinite"/></circle>
  </g>
  <!-- output (2) -->
  <g filter="url(#np-glow)">
    <circle cx="355" cy="130" r="12" fill="url(#np-dim)"/><circle cx="355" cy="130" r="12" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="2.05s" repeatCount="indefinite"/></circle>
    <circle cx="355" cy="170" r="12" fill="url(#np-dim)"/><circle cx="355" cy="170" r="12" fill="url(#np-lit)" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.35;1" dur="2.4s" begin="2.13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- labels -->
  <text x="50"  y="222" class="np-lab">Input ×3</text>
  <text x="160" y="222" class="np-lab">Dense ×4</text>
  <text x="270" y="222" class="np-lab">Dense ×4</text>
  <text x="355" y="222" class="np-lab">Out ×2</text>
  <text x="122" y="248" class="np-lab" font-size="8" style="text-anchor:start">class A</text>
  <text x="122" y="260" class="np-lab" font-size="8" style="text-anchor:start">class B</text>
  <line x1="100" y1="245" x2="116" y2="245" stroke="#56d364" stroke-width="2"/>
  <line x1="100" y1="257" x2="116" y2="257" stroke="#d2a8ff" stroke-width="2"/>
  <text x="200" y="272" text-anchor="middle" class="np-sub" font-size="7.5">surrogate-gradient spiking units · 2.4 ms refractory loop</text>
</svg>
