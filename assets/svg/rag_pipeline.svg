<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Hybrid RAG pipeline: documents to embeddings to hybrid retrieval to RRF fusion to LLM answer">
  <defs>
    <filter id="rag-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rag-title { fill:#c9d1d9; font-family:'Courier New',monospace; font-size:14px; font-weight:bold; }
      .rag-sub   { fill:#8b949e; font-family:'Courier New',monospace; font-size:9.5px; }
      .rag-lab   { fill:#c9d1d9; font-family:'Courier New',monospace; font-size:10.5px; font-weight:bold; text-anchor:middle; }
      .rag-sublab{ fill:#8b949e; font-family:'Courier New',monospace; font-size:8.5px; text-anchor:middle; }
      .rag-sec   { fill:#79c0ff; font-family:'Courier New',monospace; font-size:8.5px; font-weight:bold; text-anchor:middle; letter-spacing:1px; }
      .rag-arrow { stroke:#58a6ff; stroke-width:1.4; stroke-dasharray:5,4; opacity:0.55; fill:none; }
      .rag-stage { fill:#161b22; stroke-width:1.6; }
    </style>
  </defs>

  <rect width="800" height="260" rx="12" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="798.5" height="258.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="400" y="24" text-anchor="middle" class="rag-title">HYBRID RAG PIPELINE — AGRIIR (ECIR 2026 · FIRE 2025)</text>
  <text x="400" y="39" text-anchor="middle" class="rag-sub">query → hybrid retrieval → rank fusion → grounded generation with inline citations</text>

  <!-- ══ stages ══ -->
  <!-- 1 docs -->
  <rect x="18" y="80" width="110" height="50" rx="7" class="rag-stage" stroke="#e3b341">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="73" y="101" class="rag-lab" fill="#e3b341">DOC STORE</text>
  <text x="73" y="115" class="rag-sublab">OCR · PDF · crawl</text>
  <text x="73" y="125" class="rag-sublab">PyMuPDF · EasyOCR</text>

  <!-- 2 chunk+embed -->
  <rect x="148" y="80" width="110" height="50" rx="7" class="rag-stage" stroke="#d2a8ff">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="203" y="101" class="rag-lab" fill="#d2a8ff">EMBED</text>
  <text x="203" y="115" class="rag-sublab">chunk 512 tok</text>
  <text x="203" y="125" class="rag-sublab">Qwen3-4B · FAISS</text>

  <!-- 3 hybrid retrieval (tall) -->
  <rect x="278" y="58" width="130" height="94" rx="7" class="rag-stage" stroke="#58a6ff">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="343" y="73" class="rag-sec">RETRIEVAL</text>
  <text x="343" y="90" class="rag-lab" fill="#79c0ff" font-size="10">Dense</text>
  <text x="343" y="101" class="rag-sublab">FAISS · semantic</text>
  <line x1="286" y1="107" x2="400" y2="107" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="343" y="121" class="rag-lab" fill="#56d364" font-size="10">Sparse</text>
  <text x="343" y="132" class="rag-sublab">BM25 · keyword</text>
  <text x="343" y="146" class="rag-sublab">parallel + HyDE</text>

  <!-- 4 RRF -->
  <rect x="428" y="80" width="100" height="50" rx="7" class="rag-stage" stroke="#d2a8ff">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="3.6s" repeatCount="indefinite"/>
  </rect>
  <text x="478" y="101" class="rag-lab" fill="#d2a8ff">RRF</text>
  <text x="478" y="115" class="rag-sublab">reciprocal rank</text>
  <text x="478" y="125" class="rag-sublab">fusion · k=60</text>

  <!-- 5 LLM -->
  <rect x="548" y="80" width="100" height="50" rx="7" class="rag-stage" stroke="#ff7b72">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="4.8s" repeatCount="indefinite"/>
  </rect>
  <text x="598" y="101" class="rag-lab" fill="#ff7b72">LLM</text>
  <text x="598" y="115" class="rag-sublab">Gemma 3 27B</text>
  <text x="598" y="125" class="rag-sublab">grounded gen</text>

  <!-- 6 answer -->
  <rect x="668" y="80" width="114" height="50" rx="7" class="rag-stage" stroke="#56d364">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5;0.5" keyTimes="0;0.08;0.16;1" dur="6s" begin="6s" repeatCount="indefinite"/>
  </rect>
  <text x="725" y="101" class="rag-lab" fill="#56d364">ANSWER</text>
  <text x="725" y="115" class="rag-sublab">inline citations</text>
  <text x="725" y="125" class="rag-sublab">Streamlit UI</text>

  <!-- ══ arrows ══ -->
  <g class="rag-arrow">
    <line x1="128" y1="105" x2="146" y2="105"/>
    <line x1="258" y1="105" x2="276" y2="105"/>
    <line x1="408" y1="90"  x2="426" y2="95"/>
    <line x1="408" y1="125" x2="426" y2="115"/>
    <line x1="528" y1="105" x2="546" y2="105"/>
    <line x1="648" y1="105" x2="666" y2="105"/>
  </g>
  <g fill="#58a6ff" opacity="0.7">
    <polygon points="146,101 154,105 146,109"/><polygon points="276,101 284,105 276,109"/>
    <polygon points="426,92 434,96 425,99"/><polygon points="426,112 434,116 425,119"/>
    <polygon points="546,101 554,105 546,109"/><polygon points="666,101 674,105 666,109"/>
  </g>

  <!-- ══ travelling packet: visits every stage with holds (6s loop) ══ -->
  <circle r="5" fill="#58a6ff" filter="url(#rag-glow)">
    <animateMotion dur="6s" repeatCount="indefinite"
      keyPoints="0;0;0.199;0.199;0.414;0.414;0.621;0.621;0.805;0.805;1;1"
      keyTimes="0;0.12;0.2;0.32;0.4;0.52;0.6;0.72;0.8;0.9;0.98;1"
      calcMode="linear"
      path="M 73,105 L 203,105 L 343,105 L 478,105 L 598,105 L 725,105"/>
  </circle>
  <circle r="3" fill="#79c0ff" opacity="0.7">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite"
      keyPoints="0;0;0.199;0.199;0.414;0.414;0.621;0.621;0.805;0.805;1;1"
      keyTimes="0;0.12;0.2;0.32;0.4;0.52;0.6;0.72;0.8;0.9;0.98;1"
      calcMode="linear"
      path="M 73,105 L 203,105 L 343,105 L 478,105 L 598,105 L 725,105"/>
  </circle>

  <!-- ══ bottom strip ══ -->
  <rect x="18" y="172" width="764" height="56" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="194" text-anchor="middle" class="rag-lab" font-size="11">HYBRID RETRIEVAL → VERIFIABLE ANSWERS WITH INLINE SOURCE CITATIONS</text>
  <text x="400" y="212" text-anchor="middle" class="rag-sublab" font-size="9">HyDE hypothetical-document embeddings · query reformulation · domain-specific AgriIR corpus · IISER-K intranet deployment</text>

  <text x="400" y="248" text-anchor="middle" class="rag-sub">dense recall × sparse precision — fused without score calibration</text>
</svg>
