<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .box-active { fill: #1f2a3c; stroke: #58a6ff; stroke-width: 2; }
      .label { fill: #c9d1d9; font-family: monospace; font-size: 11px; text-anchor: middle; }
      .sublabel { fill: #8b949e; font-family: monospace; font-size: 9px; text-anchor: middle; }
      .arrow-line { stroke: #58a6ff; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
      .arrow-head { fill: #58a6ff; }
      .packet { fill: #58a6ff; animation: travel1 2.5s ease-in-out infinite; opacity: 0; }
      .packet2 { fill: #d2a8ff; animation: travel2 2.5s ease-in-out 0.8s infinite; opacity: 0; }
      .packet3 { fill: #56d364; animation: travel3 2.5s ease-in-out 1.6s infinite; opacity: 0; }
      @keyframes travel1 {
        0%   { cx: 100px; opacity: 0; }
        5%   { opacity: 1; }
        45%  { cx: 300px; opacity: 1; }
        50%  { cx: 300px; opacity: 1; }
        90%  { cx: 490px; opacity: 1; }
        95%  { opacity: 0; }
        100% { cx: 490px; opacity: 0; }
      }
      @keyframes travel2 {
        0%   { cx: 490px; opacity: 0; }
        5%   { opacity: 1; }
        45%  { cx: 600px; opacity: 1; }
        50%  { cx: 600px; opacity: 1; }
        90%  { cx: 700px; opacity: 1; }
        95%  { opacity: 0; }
        100% { cx: 700px; opacity: 0; }
      }
      @keyframes travel3 {
        0%   { cx: 100px; opacity: 0; }
        5%   { opacity: 1; }
        90%  { cx: 700px; opacity: 1; }
        95%  { opacity: 0; }
        100% { cx: 700px; opacity: 0; }
      }
      .section-title { fill: #79c0ff; font-family: monospace; font-size: 10px; text-anchor: middle; font-weight: bold; }
      .main-title { fill: #c9d1d9; font-family: monospace; font-size: 14px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>

  <!-- Stage 1: Documents -->
  <rect x="20" y="60" width="130" height="60" rx="6" class="box-active"/>
  <text x="85" y="85" class="label">Document Store</text>
  <text x="85" y="100" class="sublabel">Selenium · OCR · PDF</text>
  <text x="85" y="113" class="sublabel">PyMuPDF · EasyOCR</text>

  <!-- Stage 2: Chunking + Embeddings -->
  <rect x="195" y="60" width="130" height="60" rx="6" class="box-active"/>
  <text x="260" y="82" class="label">Chunking &amp;</text>
  <text x="260" y="96" class="label">Embeddings</text>
  <text x="260" y="113" class="sublabel">Qwen3-4B · FAISS</text>

  <!-- Stage 3: Hybrid Retrieval -->
  <rect x="370" y="40" width="130" height="100" rx="6" class="box-active"/>
  <text x="435" y="65" class="section-title">RETRIEVAL</text>
  <text x="435" y="82" class="label">Dense Search</text>
  <text x="435" y="95" class="sublabel">FAISS · Semantic</text>
  <line x1="370" y1="108" x2="500" y2="108" stroke="#30363d" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="435" y="122" class="label">Sparse Search</text>
  <text x="435" y="135" class="sublabel">BM25 · Keyword</text>

  <!-- Stage 4: RRF Fusion -->
  <rect x="555" y="60" width="110" height="60" rx="6" class="box-active"/>
  <text x="610" y="84" class="label">RRF Fusion</text>
  <text x="610" y="99" class="sublabel">Reciprocal Rank</text>
  <text x="610" y="113" class="sublabel">Fusion</text>

  <!-- Stage 5: LLM Output -->
  <rect x="720" y="40" width="60" height="100" rx="6" class="box-active"/>
  <text x="750" y="80" class="label" style="font-size:10px">LLM</text>
  <text x="750" y="95" class="sublabel">Gemma</text>
  <text x="750" y="110" class="sublabel">3:27B</text>
  <text x="750" y="130" class="sublabel">RAG</text>

  <!-- Arrows -->
  <line x1="150" y1="90" x2="192" y2="90" class="arrow-line"/>
  <polygon points="188,86 196,90 188,94" class="arrow-head"/>

  <line x1="325" y1="90" x2="367" y2="90" class="arrow-line"/>
  <polygon points="363,86 371,90 363,94" class="arrow-head"/>

  <!-- Two arrows from retrieval to fusion -->
  <line x1="500" y1="78" x2="552" y2="78" class="arrow-line"/>
  <polygon points="548,74 556,78 548,82" class="arrow-head"/>
  <line x1="500" y1="122" x2="552" y2="102" class="arrow-line"/>

  <line x1="665" y1="90" x2="717" y2="90" class="arrow-line"/>
  <polygon points="713,86 721,90 713,94" class="arrow-head"/>

  <!-- Animated packets -->
  <circle cy="90" r="5" class="packet" cx="100"/>
  <circle cy="84" r="4" class="packet2" cx="490"/>
  <circle cy="90" r="3" class="packet3" cx="100"/>

  <!-- Labels below -->
  <text x="85"  y="148" class="sublabel">Raw Sources</text>
  <text x="260" y="148" class="sublabel">Vector DB</text>
  <text x="435" y="165" class="sublabel">Parallel Retrieval</text>
  <text x="610" y="148" class="sublabel">Re-ranking</text>
  <text x="750" y="165" class="sublabel">Answer</text>

  <!-- Citations note -->
  <rect x="20" y="185" width="760" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="207" class="label">Hybrid RAG Pipeline → Verifiable Answers with Inline Source Citations</text>
  <text x="400" y="225" class="sublabel">Query Refinement · HyDE (Hypothetical Document Embeddings) · Streamlit UI · IISER-K Intranet</text>

  <text x="400" y="265" class="main-title">AgriIR / Hybrid RAG Architecture (ECIR 2026, FIRE 2025)</text>
</svg>
