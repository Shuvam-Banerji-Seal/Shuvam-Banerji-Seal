<svg viewBox="0 0 440 305" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:monospace">
  <!--
    STORY: 2D Ising-model Monte Carlo simulation.
    As temperature drops below Tc, thermal fluctuations decrease and spins
    spontaneously align into ferromagnetic order (all ↑).
    Each spin site shows two overlapping arrows (up=blue, down=red) whose
    opacity alternates — simulating the stochastic flip of individual spins.
    The magnetisation bar grows as more "up" phases dominate.
  -->

  <!-- ── Titles ── -->
  <text x="220" y="18" text-anchor="middle" fill="#d2a8ff" font-size="12" font-weight="bold">2D Ising Spin Lattice — Monte Carlo</text>
  <text x="220" y="31" text-anchor="middle" fill="#8b949e" font-size="9">Spins flip stochastically; below Tc they spontaneously align (↑ = blue, ↓ = red)</text>

  <!-- ════ 7 × 4 spin grid ════
       Each site: group at translate(cx,cy) containing UP arrow + DOWN arrow.
       UP  arrow: vertical line pointing up + upward triangle arrowhead, blue.
       DOWN arrow: vertical line pointing down + downward triangle, red.
       Opacity animations alternate between them with random phase offsets.
  -->

  <!-- MACRO to avoid repetition: spin site centred at (cx,cy)
       Ud = dur for up-state, Ud_beg = begin for up-state
       Dd = dur for down-state (same as Ud), Dd_beg = begin offset (≈ Ud/2)
  -->

  <!-- Row 0  y=70 -->
  <g transform="translate(48,70)"> <line x1="0" y1="13" x2="0" y2="-13" stroke="#58a6ff" stroke-width="2.5"/><polygon points="-5,-8 5,-8 0,-18" fill="#58a6ff"/> <animate attributeName="opacity" values="1;0;1" dur="3.1s" begin="0s" repeatCount="indefinite"/> </g>
  <g transform="translate(48,70)" opacity="0"> <line x1="0" y1="-13" x2="0" y2="13" stroke="#ff7b72" stroke-width="2.5"/><polygon points="-5,8 5,8 0,18" fill="#ff7b72"/> <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0s" repeatCount="indefinite"/> </g>

  <g transform="translate(104,70)"> <line x1="0" y1="13" x2="0" y2="-13" stroke="#58a6ff" stroke-width="2.5"/><polygon points="-5,-8 5,-8 0,-18" fill="#58a6ff"/> <animate attributeName="opacity" values="1;0;1" dur="2.8s" begin="0.35s" repeatCount="indefinite"/> </g>
  <g transform="translate(104,70)" opacity="0"> <line x1="0" y1="-13" x2="0" y2="13" stroke="#ff7b72" stroke-width="2.5"/><polygon points="-5,8 5,8 0,18" fill="#ff7b72"/> <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/> </g>

  <g transform="translate(160,70)"> <line x1="0" y1="13" x2="0" y2="-13" stroke="#58a6ff" stroke-width="2.5"/><polygon points="-5,-8 5,-8 0,-18" fill="#58a6ff"/> <animate attributeName="opacity" values="1;0;1" dur="3.5s" begin="0.7s" repeatCount="indefinite"/> </g>
  <g transform="translate(160,70)" opacity="0"> <line x1="0" y1="-13" x2="0" y2="13" stroke="#ff7b72" stroke-width="2.5"/><polygon points="-5,8 5,8 0,18" fill="#ff7b72"/> <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.7s" repeatCount="indefinite"/> </g>

