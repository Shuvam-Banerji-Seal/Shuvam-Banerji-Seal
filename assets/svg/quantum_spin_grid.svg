  <g transform="translate(328,122)"> <line x1="0" y1="13" x2="0" y2="-13" stroke="#58a6ff" stroke-width="2.5"/><polygon points="-5,-8 5,-8 0,-18" fill="#58a6ff"/> <animate attributeName="opacity" values="1;0;1" dur="2.7s" begin="0.3s" repeatCount="indefinite"/> </g>
  <g transform="translate(328,122)" opacity="0"> <line x1="0" y1="-13" x2="0" y2="13" stroke="#ff7b72" stroke-width="2.5"/><polygon points="-5,8 5,8 0,18" fill="#ff7b72"/> <animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.3s" repeatCount="indefinite"/> </g>

