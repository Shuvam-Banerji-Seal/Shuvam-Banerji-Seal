  <!-- ════ Magnetisation bar ════ -->
  <text x="14" y="212" fill="#8b949e" font-size="9" font-weight="bold">Net magnetisation  M:</text>

  <!-- axis labels -->
  <text x="14"  y="244" fill="#ff7b72" font-size="8">−1 (all ↓)</text>
  <text x="182" y="244" text-anchor="middle" fill="#8b949e" font-size="8">0</text>
  <text x="352" y="244" text-anchor="middle" fill="#58a6ff" font-size="8">+1 (all ↑)</text>

  <!-- background track -->
  <rect x="14" y="220" width="412" height="16" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <!-- midpoint marker -->
  <line x1="220" y1="218" x2="220" y2="238" stroke="#30363d" stroke-width="1"/>

  <!-- animated M bar: grows from centre rightward = positive magnetisation growing -->
  <rect x="220" y="220" width="1" height="16" rx="4" fill="#58a6ff" opacity="0.85">
    <animate attributeName="width" values="1;110;160;110;50;160;190;160;90;160" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- annotated temp label sweeping -->
  <text x="14" y="260" fill="#8b949e" font-size="8">T &gt; Tc (disordered)</text>
  <text x="426" y="260" text-anchor="end" fill="#58a6ff" font-size="8">T &lt; Tc — ordered ↑</text>

  <text x="220" y="280" text-anchor="middle" fill="#e3b341" font-size="9" font-weight="bold">Phase transition at Tc —  k_BT_c ≈ 2.27 J  (exact for 2D Ising)</text>

