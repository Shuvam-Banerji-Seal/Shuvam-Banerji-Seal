<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Shuvam Banerji Seal — Computational Chemist and AI Researcher">
  <defs>
    <linearGradient id="hb-title" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="660" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#d2a8ff;#79c0ff;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#d2a8ff">
        <animate attributeName="stop-color" values="#d2a8ff;#79c0ff;#58a6ff;#d2a8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#79c0ff">
        <animate attributeName="stop-color" values="#79c0ff;#58a6ff;#d2a8ff;#79c0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hb-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hb-nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6e40c9" stop-opacity="0.05"/>
    </radialGradient>
    <pattern id="hb-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#30363d" opacity="0.4"/>
    </pattern>
    <filter id="hb-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hb-name { font-family:'Courier New',monospace; font-weight:bold; font-size:34px; letter-spacing:2px; fill:url(#hb-title); }
      .hb-role { font-family:'Courier New',monospace; font-size:12.5px; letter-spacing:1px; fill:#8b949e; }
      .hb-led  { font-family:'Courier New',monospace; font-size:9.5px; letter-spacing:1px; }
      .hb-frame{ fill:none; stroke:#30363d; stroke-width:1.5; opacity:0.9; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="800" height="200" rx="12" fill="#0d1117"/>
  <rect width="800" height="200" rx="12" fill="url(#hb-dots)"/>
  <rect x="0.75" y="0.75" width="798.5" height="198.5" rx="11.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- corner brackets -->
  <path d="M 14,30 L 14,14 L 30,14" class="hb-frame" stroke="#58a6ff"/>
  <path d="M 770,14 L 786,14 L 786,30" class="hb-frame" stroke="#d2a8ff"/>
  <path d="M 786,170 L 786,186 L 770,186" class="hb-frame" stroke="#d2a8ff"/>
  <path d="M 30,186 L 14,186 L 14,170" class="hb-frame" stroke="#58a6ff"/>

  <!-- ══ left motif: benzene lab flask ══ -->
  <!-- hexagon ring -->
  <polygon points="85,52 124,74.5 124,119.5 85,142 46,119.5 46,74.5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="85,66 112,81.5 112,112.5 85,128 58,112.5 58,81.5" fill="none" stroke="#30363d" stroke-width="1.2"/>
  <!-- alternating double bonds -->
  <line x1="85" y1="56" x2="85" y2="70" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <line x1="120" y1="76.5" x2="108" y2="83.5" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <line x1="120" y1="117.5" x2="108" y2="110.5" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <line x1="85" y1="138" x2="85" y2="124" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <line x1="50" y1="117.5" x2="62" y2="110.5" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <line x1="50" y1="76.5" x2="62" y2="83.5" stroke="#58a6ff" stroke-width="1.6" opacity="0.8"/>
  <!-- rotating dashed inner orbit -->
  <circle cx="85" cy="97" r="20" fill="none" stroke="#d2a8ff" stroke-width="1.3" stroke-dasharray="6 5" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 85 97" to="360 85 97" dur="9s" repeatCount="indefinite"/>
  </circle>
  <!-- nucleus -->
  <circle cx="85" cy="97" r="9" fill="url(#hb-nuc)" filter="url(#hb-glow)">
    <animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <!-- orbiting electron -->
  <circle r="4" fill="#79c0ff" filter="url(#hb-glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M 143,97 A 58,58 0 1 1 27,97 A 58,58 0 1 1 143,97"/>
  </circle>
  <circle r="2.6" fill="#56d364" opacity="0.9">
    <animateMotion dur="4.5s" begin="-2.25s" repeatCount="indefinite"
      path="M 143,97 A 58,58 0 1 1 27,97 A 58,58 0 1 1 143,97"/>
  </circle>

  <!-- ══ name + sweeping gradient ══ -->
  <text x="445" y="82" text-anchor="middle" class="hb-name">SHUVAM BANERJI SEAL</text>
  <!-- typing cursor -->
  <rect x="662" y="52" width="4" height="36" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- hairline -->
  <line x1="180" y1="98" x2="770" y2="98" stroke="url(#hb-rule)" stroke-width="1"/>

  <!-- ══ rotating roles (SMIL crossfade, 12s cycle, 4 slots) ══ -->
  <text x="445" y="122" text-anchor="middle" class="hb-role" opacity="0">COMPUTATIONAL CHEMIST — DFT · LAMMPS · GAUSSIAN
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" begin="0s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="445" y="122" text-anchor="middle" class="hb-role" opacity="0">AI / ML RESEARCHER — RAG · IR · NLP (ECIR · FIRE · TREC)
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" begin="3s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="445" y="122" text-anchor="middle" class="hb-role" opacity="0">DEEPTECH CO-FOUNDER — SYNAPSE · UNDERWATER AI
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" begin="6s" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="445" y="122" text-anchor="middle" class="hb-role" opacity="0">BS-MS @ IISER KOLKATA — CHEMISTRY MAJOR · CS MINOR
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.27;0.33;1" begin="9s" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ══ status LEDs ══ -->
  <circle cx="252" cy="158" r="3.5" fill="#56d364">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="262" y="162" class="hb-led" fill="#56d364">RESEARCH: ACTIVE</text>

  <circle cx="422" cy="158" r="3.5" fill="#d2a8ff">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="432" y="162" class="hb-led" fill="#d2a8ff">VENTURES: 2 FUNDED</text>

  <circle cx="600" cy="158" r="3.5" fill="#e3b341">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="610" y="162" class="hb-led" fill="#e3b341">PUBLICATIONS: 3</text>

  <!-- bottom hairline -->
  <line x1="180" y1="176" x2="770" y2="176" stroke="#30363d" stroke-width="1" opacity="0.7"/>
</svg>
